components:
  schemas:
    ActivityEventSchema:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        event_type:
          type: string
          title: Event Type
        severity:
          type: string
          title: Severity
        source:
          type: string
          title: Source
        message:
          type: string
          title: Message
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payload
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
      type: object
      required:
      - id
      - event_type
      - severity
      - source
      - message
      - actor
      - correlation_id
      - payload
      - occurred_at
      title: ActivityEventSchema
    ActivityPageSchema:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityEventSchema'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
      - items
      - total
      - page
      - page_size
      title: ActivityPageSchema
    AgentDecisionPageSchema:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentDecisionSchema'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
      - items
      - total
      - page
      - page_size
      title: AgentDecisionPageSchema
    AgentDecisionSchema:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        agent_run_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Agent Run Id
        symbol:
          type: string
          title: Symbol
        action:
          $ref: '#/components/schemas/OrderAction'
        confidence:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Confidence
        reasoning_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning Summary
        evidence:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Evidence
        concerns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Concerns
        proposal_recommended:
          type: boolean
          title: Proposal Recommended
        market_regime:
          anyOf:
          - $ref: '#/components/schemas/MarketRegime'
          - type: 'null'
        strategy_signal_ids:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Strategy Signal Ids
        proposal_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Proposal Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - agent_run_id
      - symbol
      - action
      - confidence
      - reasoning_summary
      - evidence
      - concerns
      - proposal_recommended
      - market_regime
      - strategy_signal_ids
      - proposal_id
      - created_at
      title: AgentDecisionSchema
    AgentMode:
      type: string
      enum:
      - ANALYSIS_ONLY
      - PROPOSE
      - AUTO_TRADE
      title: AgentMode
    AgentRunCreateRequest:
      properties:
        symbol:
          type: string
          maxLength: 32
          minLength: 1
          title: Symbol
        timeframe:
          type: string
          maxLength: 16
          title: Timeframe
          default: 1h
        mode:
          $ref: '#/components/schemas/AgentMode'
          default: ANALYSIS_ONLY
        provider_config_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Provider Config Id
        broker_account_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Broker Account Id
        prompt:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Prompt
      type: object
      required:
      - symbol
      title: AgentRunCreateRequest
    AgentRunPageSchema:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentRunSchema'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
      - items
      - total
      - page
      - page_size
      title: AgentRunPageSchema
    AgentRunSchema:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          $ref: '#/components/schemas/RunStatus'
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        mode:
          $ref: '#/components/schemas/AgentMode'
        symbols:
          items:
            type: string
          type: array
          title: Symbols
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        latency_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latency Ms
        tokens_used:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokens Used
        usage:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Usage
        proposal_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Proposal Id
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
