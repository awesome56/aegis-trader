      tags:
      - broker
      summary: Re-evaluate open paper orders (testing/worker hook)
      operationId: process_open_orders_api_v1_broker_orders_process_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BrokerOrderSchema'
                type: array
                title: Response Process Open Orders Api V1 Broker Orders Process Post
      security:
      - HTTPBearer: []
  /api/v1/notifications:
    get:
      tags:
      - notifications
      summary: List notifications
      operationId: list_notifications_api_v1_notifications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unread Only
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications/unread-count:
    get:
      tags:
      - notifications
      summary: Unread notification count
      operationId: unread_count_api_v1_notifications_unread_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountSchema'
      security:
      - HTTPBearer: []
  /api/v1/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      summary: Mark read
      operationId: mark_read_api_v1_notifications__notification_id__read_post
      security:
      - HTTPBearer: []
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notifications/read-all:
    post:
      tags:
      - notifications
      summary: Mark all read
      operationId: mark_all_read_api_v1_notifications_read_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountSchema'
      security:
      - HTTPBearer: []
  /api/v1/strategies:
    get:
      tags:
      - strategies
      summary: List strategies
      operationId: list_strategies_api_v1_strategies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StrategySchema'
                type: array
                title: Response List Strategies Api V1 Strategies Get
      security:
      - HTTPBearer: []
  /api/v1/strategies/signals:
    get:
      tags:
      - strategies
      summary: List strategy signals
      operationId: list_signals_api_v1_strategies_signals_get
      security:
      - HTTPBearer: []
      parameters:
      - name: strategy_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Strategy Id
      - name: symbol
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Symbol
      - name: timeframe
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Timeframe
      - name: direction
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SignalDirection'
          - type: 'null'
          title: Direction
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
