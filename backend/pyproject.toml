[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aegis-trader-backend"
version = "0.1.0"
description = "AI-assisted, risk-gated automated trading platform (paper trading first)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Personal Trading Platform" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "greenlet>=3.0.0",
    "redis>=5.0.7",
    "arq>=0.26",
    "cryptography>=42",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
analytics = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.4.0",
]
agents = [
    "pydantic-ai>=0.0.14",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S105", "S106"]  # asserts expected; credential-like defaults are examples

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Deterministic pseudo-random generation is intentional for the mock provider
# (reproducible fixtures), never used for security.
"app/market/providers/mock.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
