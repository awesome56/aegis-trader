openapi: 3.1.0
info:
  title: Aegis Trader
  description: AI-assisted, risk-gated automated trading platform. Paper trading only
    in V1; the LLM can only create trade proposals.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Aggregate health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Liveness probe
      operationId: liveness_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Liveness Api V1 Health Live Get
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Readiness probe
      operationId: readiness_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readiness Api V1 Health Ready Get
  /api/v1/auth/registration-open:
    get:
      tags:
      - auth
      summary: Whether bootstrap registration is allowed
      operationId: registration_open_api_v1_auth_registration_open_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Registration Open Api V1 Auth Registration Open Get
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Bootstrap owner
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate refresh token
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke a session
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Current user
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - HTTPBearer: []
  /api/v1/auth/sessions:
    get:
      tags:
      - auth
      summary: Active sessions/devices
      operationId: sessions_api_v1_auth_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionRead'
                type: array
                title: Response Sessions Api V1 Auth Sessions Get
      security:
      - HTTPBearer: []
  /api/v1/system/status:
    get:
      tags:
      - system
      summary: System and trading status
      operationId: status_api_v1_system_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /api/v1/markets/status:
    get:
      tags:
      - markets
      summary: Market session status
      operationId: market_status_api_v1_markets_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatusSchema'
      security:
      - HTTPBearer: []
  /api/v1/markets/search:
    get:
      tags:
      - markets
      summary: Search assets
      operationId: search_assets_api_v1_markets_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          description: Symbol or name fragment
          title: Q
        description: Symbol or name fragment
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetSearchSchema'
                title: Response Search Assets Api V1 Markets Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{symbol}/quote:
    get:
      tags:
      - markets
      summary: Latest quote
      operationId: get_quote_api_v1_markets__symbol__quote_get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{symbol}/candles:
    get:
      tags:
      - markets
      summary: Historical candles
      operationId: get_candles_api_v1_markets__symbol__candles_get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      - name: timeframe
        in: query
        required: false
        schema:
          type: string
          description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
          default: 1h
          title: Timeframe
        description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive start (ISO 8601)
          title: Start
        description: Inclusive start (ISO 8601)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive end (ISO 8601)
          title: End
        description: Inclusive end (ISO 8601)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleSeriesSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{symbol}/indicators:
    get:
      tags:
      - markets
      summary: Technical indicators
      operationId: get_indicators_api_v1_markets__symbol__indicators_get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      - name: timeframe
        in: query
        required: false
        schema:
          type: string
          description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
          default: 1h
          title: Timeframe
        description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponseSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      tags:
      - meta
      summary: Service banner
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
components:
  schemas:
    AssetSearchSchema:
      properties:
        symbol:
          type: string
          title: Symbol
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        asset_class:
          type: string
          title: Asset Class
        exchange:
          anyOf:
          - type: string
          - type: 'null'
          title: Exchange
        currency:
          type: string
          title: Currency
        provider:
          type: string
          title: Provider
      type: object
      required:
      - symbol
      - name
      - asset_class
      - exchange
      - currency
      - provider
      title: AssetSearchSchema
    AuthResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserRead'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      type: object
      required:
      - user
      - tokens
      title: AuthResponse
    BollingerSchema:
      properties:
        period:
          type: integer
          title: Period
        std_dev:
          type: number
          title: Std Dev
        latest_middle:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Middle
        latest_upper:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Upper
        latest_lower:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Lower
        latest_bandwidth:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Bandwidth
        latest_percent_b:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Percent B
        middle:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Middle
        upper:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Upper
        lower:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Lower
        bandwidth:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Bandwidth
        percent_b:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Percent B
      type: object
      required:
      - period
      - std_dev
      - latest_middle
      - latest_upper
      - latest_lower
      - latest_bandwidth
      - latest_percent_b
      - middle
      - upper
      - lower
      - bandwidth
      - percent_b
      title: BollingerSchema
    CandleSchema:
      properties:
        open_time:
          type: string
          format: date-time
          title: Open Time
        close_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Close Time
        open:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Open
        high:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: High
        low:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Low
        close:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Close
        volume:
          anyOf:
          - type: integer
          - type: 'null'
          title: Volume
        trade_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trade Count
        vwap:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Vwap
      type: object
      required:
      - open_time
      - close_time
      - open
      - high
      - low
      - close
      - volume
      - trade_count
      - vwap
      title: CandleSchema
    CandleSeriesSchema:
      properties:
        symbol:
          type: string
          title: Symbol
        timeframe:
          type: string
          title: Timeframe
        provider:
          type: string
          title: Provider
        candles:
          items:
            $ref: '#/components/schemas/CandleSchema'
          type: array
          title: Candles
        is_stale:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Stale
        age_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Age Seconds
      type: object
      required:
      - symbol
      - timeframe
      - provider
      - candles
      title: CandleSeriesSchema
    ComponentHealth:
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
          - not_configured
          title: Status
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - name
      - status
      title: ComponentHealth
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
          title: Status
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
        environment:
          type: string
          title: Environment
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        components:
          items:
            $ref: '#/components/schemas/ComponentHealth'
          type: array
          title: Components
      type: object
      required:
      - status
      - service
      - version
      - environment
      - timestamp
      - components
      title: HealthResponse
    IndicatorPointSchema:
      properties:
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
        value:
          type: number
          title: Value
      type: object
      required:
      - timestamp
      - value
      title: IndicatorPointSchema
    IndicatorResponseSchema:
      properties:
        symbol:
          anyOf:
          - type: string
          - type: 'null'
          title: Symbol
        timeframe:
          anyOf:
          - type: string
          - type: 'null'
          title: Timeframe
        price:
          anyOf:
          - type: number
          - type: 'null'
          title: Price
        data_timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Data Timestamp
        calculated_at:
          type: string
          format: date-time
          title: Calculated At
        age_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Age Seconds
        is_stale:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Stale
        sma:
          $ref: '#/components/schemas/SeriesSchema'
        ema:
          $ref: '#/components/schemas/SeriesSchema'
        rsi:
          $ref: '#/components/schemas/SeriesSchema'
        macd:
          $ref: '#/components/schemas/MACDSchema'
        atr:
          $ref: '#/components/schemas/SeriesSchema'
        bollinger:
          $ref: '#/components/schemas/BollingerSchema'
        volume:
          $ref: '#/components/schemas/VolumeSchema'
      type: object
      required:
      - symbol
      - timeframe
      - price
      - data_timestamp
      - calculated_at
      - age_seconds
      - is_stale
      - sma
      - ema
      - rsi
      - macd
      - atr
      - bollinger
      - volume
      title: IndicatorResponseSchema
    LiveTradingGuard:
      properties:
        allowed:
          type: boolean
          title: Allowed
        missing_requirements:
          items:
            type: string
          type: array
          title: Missing Requirements
      type: object
      required:
      - allowed
      - missing_requirements
      title: LiveTradingGuard
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 72
          minLength: 1
          title: Password
        device_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Device Name
      type: object
      required:
      - email
      - password
      title: LoginRequest
    LogoutRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: LogoutRequest
    MACDSchema:
      properties:
        fast_period:
          type: integer
          title: Fast Period
        slow_period:
          type: integer
          title: Slow Period
        signal_period:
          type: integer
          title: Signal Period
        latest_macd:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Macd
        latest_signal:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Signal
        latest_histogram:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest Histogram
        macd:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Macd
        signal:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Signal
        histogram:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Histogram
      type: object
      required:
      - fast_period
      - slow_period
      - signal_period
      - latest_macd
      - latest_signal
      - latest_histogram
      - macd
      - signal
      - histogram
      title: MACDSchema
    MarketSession:
      type: string
      enum:
      - PRE_MARKET
      - REGULAR
      - AFTER_HOURS
      - CLOSED
      title: MarketSession
    MarketStatusSchema:
      properties:
        market:
          type: string
          title: Market
        is_open:
          type: boolean
          title: Is Open
        session:
          $ref: '#/components/schemas/MarketSession'
        opens_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Opens At
        closes_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closes At
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        provider:
          type: string
          title: Provider
      type: object
      required:
      - market
      - is_open
      - session
      - opens_at
      - closes_at
      - timestamp
      - provider
      title: MarketStatusSchema
    Message:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: Message
    QuoteSchema:
      properties:
        symbol:
          type: string
          title: Symbol
        bid:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Bid
        ask:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Ask
        last:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Last
        open:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Open
        high:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: High
        low:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Low
        previous_close:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Previous Close
        volume:
          anyOf:
          - type: integer
          - type: 'null'
          title: Volume
        currency:
          type: string
          title: Currency
        provider:
          type: string
          title: Provider
        market_timestamp:
          type: string
          format: date-time
          title: Market Timestamp
        received_at:
          type: string
          format: date-time
          title: Received At
        age_seconds:
          type: number
          title: Age Seconds
        is_stale:
          type: boolean
          title: Is Stale
      type: object
      required:
      - symbol
      - bid
      - ask
      - last
      - open
      - high
      - low
      - previous_close
      - volume
      - currency
      - provider
      - market_timestamp
      - received_at
      - age_seconds
      - is_stale
      title: QuoteSchema
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 72
          minLength: 12
          title: Password
        full_name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Full Name
      type: object
      required:
      - email
      - password
      title: RegisterRequest
    SeriesSchema:
      properties:
        period:
          type: integer
          title: Period
        latest:
          anyOf:
          - type: number
          - type: 'null'
          title: Latest
        values:
          items:
            $ref: '#/components/schemas/IndicatorPointSchema'
          type: array
          title: Values
      type: object
      required:
      - period
      - latest
      - values
      title: SeriesSchema
    SessionRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        device_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Name
        ip_address:
          anyOf:
