# Production stack for the Lenovo server.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile tunnel up -d   # with Cloudflare Tunnel
#
# Only the backend is bound, and only on the loopback interface. PostgreSQL and
# Redis stay on the internal Docker network. Public exposure is handled by a
# Cloudflare Tunnel (profile: tunnel) or by host nginx.
name: aegis

services:
  db:
    image: postgres:16-alpine
    container_name: aegis-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-trader}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    image: aegis-backend:latest
    container_name: aegis-backend
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8899}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Browser terminal (Nuxt SPA). Public hostname: trader.awesometech.com.ng
  web:
    build:
      context: ./web
      target: runtime
    image: aegis-web:latest
    container_name: aegis-web
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-https://traderbackend.awesometech.com.ng}
      NUXT_PUBLIC_WS_BASE_URL: ${NUXT_PUBLIC_WS_BASE_URL:-wss://traderbackend.awesometech.com.ng}
      NUXT_PUBLIC_USE_MOCK_API: 'false'
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-9077}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Cloudflare Tunnel: exposes backend publicly at traderbackend.awesometech.com.ng
  # without opening any router port. Enable with `--profile tunnel`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aegis-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  pgdata:
  redisdata:
