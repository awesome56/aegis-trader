openapi: 3.1.0
info:
  title: Aegis Trader
  description: AI-assisted, risk-gated automated trading platform. Paper trading only
    in V1; the LLM can only create trade proposals.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Aggregate health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Liveness probe
      operationId: liveness_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Liveness Api V1 Health Live Get
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Readiness probe
      operationId: readiness_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readiness Api V1 Health Ready Get
  /api/v1/auth/registration-open:
    get:
      tags:
      - auth
      summary: Whether bootstrap registration is allowed
      operationId: registration_open_api_v1_auth_registration_open_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Registration Open Api V1 Auth Registration Open Get
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Bootstrap owner
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate refresh token
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke a session
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Current user
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - HTTPBearer: []
  /api/v1/auth/sessions:
    get:
      tags:
      - auth
      summary: Active sessions/devices
      operationId: sessions_api_v1_auth_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionRead'
                type: array
                title: Response Sessions Api V1 Auth Sessions Get
      security:
      - HTTPBearer: []
  /api/v1/system/status:
    get:
      tags:
      - system
      summary: System and trading status
      operationId: status_api_v1_system_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /api/v1/markets/status:
    get:
      tags:
      - markets
      summary: Market session status
      operationId: market_status_api_v1_markets_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatusSchema'
      security:
      - HTTPBearer: []
  /api/v1/markets/overview:
    get:
      tags:
      - markets
      summary: Watchlist overview
      description: Configured symbol universe with quotes and the latest strategy
        signal.
      operationId: market_overview_api_v1_markets_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverviewSchema'
      security:
      - HTTPBearer: []
  /api/v1/markets/search:
    get:
      tags:
      - markets
      summary: Search assets
      operationId: search_assets_api_v1_markets_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          description: Symbol or name fragment
          title: Q
        description: Symbol or name fragment
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetSearchSchema'
                title: Response Search Assets Api V1 Markets Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{symbol}/quote:
    get:
      tags:
      - markets
      summary: Latest quote
      operationId: get_quote_api_v1_markets__symbol__quote_get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{symbol}/candles:
    get:
      tags:
      - markets
      summary: Historical candles
      operationId: get_candles_api_v1_markets__symbol__candles_get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      - name: timeframe
        in: query
        required: false
        schema:
          type: string
          description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
          default: 1h
          title: Timeframe
        description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive start (ISO 8601)
          title: Start
        description: Inclusive start (ISO 8601)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive end (ISO 8601)
          title: End
        description: Inclusive end (ISO 8601)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleSeriesSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/markets/{symbol}/indicators:
    get:
      tags:
      - markets
      summary: Technical indicators
      operationId: get_indicators_api_v1_markets__symbol__indicators_get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      - name: timeframe
        in: query
        required: false
        schema:
          type: string
          description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
          default: 1h
          title: Timeframe
        description: 'Candle timeframe: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponseSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard:
    get:
      tags:
      - dashboard
      summary: Aggregated dashboard data
      operationId: get_dashboard_api_v1_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSchema'
      security:
      - HTTPBearer: []
  /api/v1/portfolio:
    get:
      tags:
      - portfolio
      summary: Portfolio summary
      operationId: get_portfolio_api_v1_portfolio_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
      security:
      - HTTPBearer: []
  /api/v1/portfolio/snapshot:
    post:
      tags:
      - portfolio
      summary: Create a portfolio snapshot (interval-bucketed, idempotent)
      description: Trigger a snapshot. Also the hook a future scheduler/worker calls.
      operationId: create_snapshot_api_v1_portfolio_snapshot_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPoint'
      security:
      - HTTPBearer: []
  /api/v1/portfolio/history:
    get:
      tags:
      - portfolio
      summary: Portfolio equity history
      operationId: get_history_api_v1_portfolio_history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: range
        in: query
        required: false
        schema:
          type: string
          description: 1D|1W|1M|3M|6M|YTD|1Y|ALL
          default: 1M
          title: Range
        description: 1D|1W|1M|3M|6M|YTD|1Y|ALL
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Custom start (ISO 8601)
          title: Start
        description: Custom start (ISO 8601)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Custom end (ISO 8601)
          title: End
        description: Custom end (ISO 8601)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioHistory'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/portfolio/allocation:
    get:
      tags:
      - portfolio
      summary: Portfolio allocation
      operationId: get_allocation_api_v1_portfolio_allocation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationBreakdown'
      security:
      - HTTPBearer: []
  /api/v1/positions:
    get:
      tags:
      - positions
      summary: List open positions
      operationId: list_positions_api_v1_positions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PositionValuation'
                type: array
                title: Response List Positions Api V1 Positions Get
      security:
      - HTTPBearer: []
  /api/v1/positions/{position_id}:
    get:
      tags:
      - positions
      summary: Position detail
      operationId: get_position_api_v1_positions__position_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: position_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Position Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionValuation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broker/account:
    get:
      tags:
      - broker
      summary: Paper broker account state
      operationId: get_account_api_v1_broker_account_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerAccountSchema'
      security:
      - HTTPBearer: []
  /api/v1/broker/positions:
    get:
      tags:
      - broker
      summary: Broker positions
      operationId: get_positions_api_v1_broker_positions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BrokerPositionSchema'
                type: array
                title: Response Get Positions Api V1 Broker Positions Get
      security:
      - HTTPBearer: []
  /api/v1/broker/positions/{symbol}:
    get:
      tags:
      - broker
      summary: Broker position by symbol
      operationId: get_position_api_v1_broker_positions__symbol__get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerPositionSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broker/quote/{symbol}:
    get:
      tags:
      - broker
      summary: Quote via the broker
      operationId: get_quote_api_v1_broker_quote__symbol__get
      security:
      - HTTPBearer: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerQuoteSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broker/clock:
    get:
      tags:
      - broker
      summary: Market clock
      operationId: get_clock_api_v1_broker_clock_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketClockSchema'
      security:
      - HTTPBearer: []
  /api/v1/broker/orders:
    get:
      tags:
      - broker
      summary: List broker orders
      operationId: list_orders_api_v1_broker_orders_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by order status
          title: Status
        description: Filter by order status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOrderListSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - broker
      summary: Submit a manual paper order
      operationId: submit_order_api_v1_broker_orders_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOrderSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broker/orders/{order_id}:
    get:
      tags:
      - broker
      summary: Broker order by id
      operationId: get_order_api_v1_broker_orders__order_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOrderSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - broker
      summary: Cancel a manual paper order
      operationId: cancel_order_api_v1_broker_orders__order_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOrderSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broker/orders/process:
