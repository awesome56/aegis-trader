# Fallback reverse proxy for the Lenovo server when port-forwarding is used
# instead of a Cloudflare Tunnel. Certbot (Let's Encrypt) rewrites this into the
# 443 server block automatically:
#
#   sudo cp deploy/nginx/rider.awesometech.com.ng.conf \
#           /etc/nginx/sites-available/rider.awesometech.com.ng
#   sudo ln -s /etc/nginx/sites-available/rider.awesometech.com.ng \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rider.awesometech.com.ng

server {
    listen 80;
    listen [::]:80;
    server_name rider.awesometech.com.ng;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
